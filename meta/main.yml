galaxy_info:
  author: Robert Wimmer
  description: Manage Linux Logical Volume Manager resources
  license: GPLv3
  min_ansible_version: "2.9"
  role_name: lvm
  namespace: githubixx
  platforms:
    - name: ArchLinux
    - name: Ubuntu
      versions:
        - "jammy"
        - "noble"
    - name: Debian
      versions:
        - "bullseye"
        - "bookworm"
        - "trixie"
    - name: EL
      versions:
        - "9"
        - "10"
    - name: Fedora
      versions:
        - "42"
        - "43"
        - "44"
    - name: opensuse
      versions:
        - "all"
  galaxy_tags:
    - linux
    - lvm
    - volume
    - lv
    - vg
collections:
  - community.general
  - ansible.posix
