- name: Prepare Archlinux
  hosts: test-lvm-arch
  remote_user: vagrant
  become: true
  gather_facts: false
  tasks:
    - name: Init pacman
      ansible.builtin.raw: |
        pacman-key --init
        pacman-key --populate archlinux
      changed_when: false
      failed_when: false

    - name: Updating pacman cache
      ansible.builtin.raw: pacman -Sy
      changed_when: false
      failed_when: false

    - name: Install Python
      ansible.builtin.raw: |
        pacman -S --noconfirm python
      args:
        executable: /bin/bash
      changed_when: false

- name: Prepare Debian-family systems
  hosts: all
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: (Debian-family) Update APT package cache
      when: ansible_facts['os_family'] | lower == 'debian'
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: (RedHat-family) Update package cache
      when: ansible_facts['os_family'] | lower == 'redhat'
      ansible.builtin.command: "{{ ansible_facts['pkg_mgr'] }} -y makecache"
      changed_when: false

    - name: (SuSE-family) Update package cache
      when: ansible_facts['os_family'] | lower == 'suse'
      ansible.builtin.command: zypper --gpg-auto-import-keys refresh
      changed_when: false
