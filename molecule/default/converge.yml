- name: Include LVM role
  hosts: test-lvm-ubuntu2204
  vars_files:
    - vars/test-lvm-minimal.yml
  remote_user: vagrant
  become: true
  gather_facts: true
  tasks:
    - name: Include LVM role
      ansible.builtin.include_role:
        name: githubixx.lvm

