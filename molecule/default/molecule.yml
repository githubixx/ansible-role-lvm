provisioner:
  name: ansible
  connection_options:
    ansible_ssh_user: vagrant
    ansible_become: true
  log: true
  lint: yamllint . && flake8 && ansible-lint
  inventory:
    host_vars:
      test-lvm-arch:
        ansible_python_interpreter: "/usr/bin/python3"

scenario:
  name: default
  test_sequence:
    - prepare
    - converge
    - verify
  destroy_sequence:
    - destroy
    - cleanup

verifier:
  name: ansible
  enabled: true
